<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image slider</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    
    <section class="slider">
        <div class="slide">
            <img class="imgSlider" src="./imgs/images.jpg" alt="imgSlider">

            <div class="control"> 
            <button class="normal" id="prv">prev</button>
            <button class="normal" id="nxt">next</button></div>
           
        </div>
    </section>
</body>
</html>
